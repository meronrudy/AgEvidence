name: Research Examples

on:
  pull_request:
    paths:
      - "docs/researchers/**"
      - "examples/researchers/**"
      - "fixtures/researchers/**"
      - "notebooks/researchers/**"
      - "tests/researchers/**"
      - "sdks/python/pyproject.toml"
      - ".github/workflows/research-examples.yml"
  push:
    branches:
      - researchers
    paths:
      - "docs/researchers/**"
      - "examples/researchers/**"
      - "fixtures/researchers/**"
      - "notebooks/researchers/**"
      - "tests/researchers/**"
      - "sdks/python/pyproject.toml"
      - ".github/workflows/research-examples.yml"
  workflow_dispatch:

jobs:
  research-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK with research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "sdks/python[research,test]"

      - name: Research tests
        run: python -m pytest tests/researchers

      - name: Canonical research examples
        run: |
          python examples/researchers/01_roque_2021/run.py
          python examples/researchers/02_methane_database_2024/run.py

      - name: Research notebooks
        run: |
          jupyter nbconvert --execute notebooks/researchers/*.ipynb --to notebook --output-dir /tmp/agevidence-research-notebooks
