name: Trust Core

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash protocol/conformance/scripts/agevidence_check_all.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo run -p agevidence-cli -- conformance

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/python[test]"
      - run: python -m pytest packages/python/tests

  ruby-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rake
