name: Rails

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agevidence_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true
          working-directory: apps/console
      - run: bin/rails db:prepare
      - run: bin/rails db:migrate
      - run: bin/rails db:seed
      - run: bin/rails test
      - run: SECRET_KEY_BASE_DUMMY=1 DATABASE_URL=postgres://postgres:postgres@localhost:5432/agevidence_test RAILS_ALLOWED_HOSTS=example.com RAILS_ENV=production bin/rails assets:precompile
      - run: bundle exec brakeman --no-pager
      - run: bundle exec bundle-audit check --update
      - run: bundle exec rubocop --fail-level fatal
