[workspace]
members = [
    "crates/agevidence-core",
    "crates/agevidence-schema",
    "crates/agevidence-canonical",
    "crates/agevidence-crypto",
    "crates/agevidence-bundle",
    "crates/agevidence-verify",
    "crates/agevidence-domain",
    "crates/agevidence-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.5"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
