[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agevidence"
version = "0.1.0"
description = "Canonical Python SDK and CLI for the Athian AgEvidence Developer OS"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2"
]

[project.scripts]
agevidence = "agevidence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
